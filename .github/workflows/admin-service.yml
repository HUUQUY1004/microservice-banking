name: Build & Push Admin Service

on:
  push:
    paths:
      - "services/admin-service/**"
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./services/admin-service/admin-service
          push: true
          tags: 
            bridget1004/mini-banking-admin-service:${{github.sha}}
            bridget1004/mini-banking-admin-service:latest